name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Publish release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BluetoothLink.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BluetoothLink.apk \
            --title "Bluetooth Link (latest)" \
            --notes "Latest build of Bluetooth Link. Download BluetoothLink.apk and install it on both phones."

      - name: Save build log on failure
        if: failure()
        run: |
          tail -n 300 build.log > /tmp/build_tail.log || echo "no log" > /tmp/build_tail.log
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan buildlog
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/build_tail.log build_tail.log
          git add build_tail.log
          git commit -m "build log"
          git push -f origin buildlog
