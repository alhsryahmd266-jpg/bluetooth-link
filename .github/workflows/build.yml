name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Publish release with APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk BluetoothLink.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BluetoothLink.apk \
            --title "Bluetooth Link (latest)" \
            --notes "Latest build of Bluetooth Link. Download BluetoothLink.apk and install it on both phones."

      - name: Publish download page (GitHub Pages)
        if: success()
        run: |
          mkdir site
          cp BluetoothLink.apk site/BluetoothLink.apk
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Bluetooth Link</title>
          <style>
          body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b14;color:#fff;font-family:system-ui,sans-serif;text-align:center}
          .c{padding:24px;max-width:420px}
          a.b{display:block;margin-top:24px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#22d3ee,#6366f1);color:#fff;font-size:20px;font-weight:700;text-decoration:none}
          p{color:#8b9bb8;line-height:1.7}
          </style></head><body><div class="c">
          <h1>Bluetooth Link</h1>
          <p>جاري تنزيل التطبيق... لو ما بدأش التنزيل اضغط الزر.</p>
          <a class="b" href="BluetoothLink.apk" download>تنزيل التطبيق (APK)</a>
          </div>
          <script>setTimeout(function(){location.href='BluetoothLink.apk'},800)</script>
          </body></html>
          HTML
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "ci"; git config user.email "ci@example.com"
          git add -A
          git commit -qm "site"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Save build log on failure
        if: failure()
        run: |
          tail -n 300 build.log > /tmp/build_tail.log || echo "no log" > /tmp/build_tail.log
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan buildlog
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/build_tail.log build_tail.log
          git add build_tail.log
          git commit -m "build log"
          git push -f origin buildlog
